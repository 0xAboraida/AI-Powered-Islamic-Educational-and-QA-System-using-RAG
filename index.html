  <script>
    (function() {
      try {
        var theme = localStorage.getItem('zad_theme') || 'light';
        var accent = localStorage.getItem('zad_accent_color') || 'amber';
        document.documentElement.setAttribute('data-accent', accent);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
