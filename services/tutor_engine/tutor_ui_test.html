<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُختبر المعلم الذكي (Tutor UI)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; font-size: 2.5em; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .container { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; flex-wrap: wrap; }
        .panel { background-color: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); flex: 1; min-width: 350px; display: flex; flex-direction: column; }
        .panel h2 { color: #f8fafc; margin-top: 0; font-size: 1.3em; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        textarea { width: 100%; height: 300px; background-color: #0f172a; color: #22c55e; border: 1px solid #334155; border-radius: 8px; padding: 15px; font-size: 16px; line-height: 1.6; resize: vertical; box-sizing: border-box; }
        button { background-color: #0284c7; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; transition: background-color 0.3s; margin-top: 15px; }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        
        /* Chat Area */
        .chat-box { flex: 1; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; height: 400px; margin-bottom: 15px; }
        .message { max-width: 85%; padding: 12px 18px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .message.user { align-self: flex-start; background-color: #0284c7; color: white; border-bottom-right-radius: 0; }
        .message.bot { align-self: flex-end; background-color: #334155; color: #f8fafc; border-bottom-left-radius: 0; white-space: pre-wrap; }
        
        .input-group { display: flex; gap: 10px; }
        .input-group input { flex: 1; padding: 12px 15px; background-color: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; font-size: 15px; }
        .input-group button { width: auto; margin-top: 0; padding: 12px 20px; background-color: #10b981; }
        .input-group button:hover { background-color: #059669; }
        
        .loading { font-style: italic; color: #94a3b8; font-size: 0.9em; display: none; align-self: center; }
    </style>
</head>
<body>

    <h1>مُختبر المعلم الذكي (Tutor UI) 🤖</h1>

    <div class="container">
        <!-- Input Text Panel -->
        <div class="panel">
            <h2>1. النص الفقهي (الدرس)</h2>
            <textarea id="rawText" placeholder="ضع النص الذي تود أن يشرحه لك المعلم زاد هنا..."></textarea>
            <button id="startLessonBtn" onclick="startLesson()">ابدأ الدرس الآن</button>
        </div>

        <!-- Chat Panel -->
        <div class="panel">
            <h2>2. المحادثة مع زاد</h2>
            <div class="chat-box" id="chatBox">
                <div class="message bot">مرحباً بك! ضع النص الفقهي في المربع الجانبي، ثم اضغط على "ابدأ الدرس الآن" لكي أقوم بوضع خطة دراسية لك ونبدأ.</div>
            </div>
            <div class="loading" id="loadingIndicator">زاد يكتب...</div>
            <div class="input-group">
                <input type="text" id="userInput" placeholder="اكتب سؤالك أو ردك هنا..." disabled onkeypress="handleEnter(event)">
                <button id="sendBtn" onclick="sendMessage()" disabled>إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let chatHistory = [];
        const chatBox = document.getElementById('chatBox');
        const rawTextInput = document.getElementById('rawText');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const startLessonBtn = document.getElementById('startLessonBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'user' : 'bot'}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function startLesson() {
            const chunkText = rawTextInput.value.trim();
            if (!chunkText) {
                alert("الرجاء وضع النص الفقهي أولاً!");
                return;
            }

            // Lock the text area so it doesn't change during the session
            rawTextInput.disabled = true;
            startLessonBtn.disabled = true;
            chatHistory = [];
            
            chatBox.innerHTML = ''; // clear previous
            
            const initialMsg = "مرحباً يا زاد، أنا مستعد لبدء دراسة هذا الدرس، هل يمكنك وضع خطة والبدء بالشرح؟";
            appendMessage('user', initialMsg);
            
            await sendToApi(chunkText, initialMsg);
            
            // Enable chat inputs
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        async function sendMessage() {
            const msg = userInput.value.trim();
            if(!msg) return;

            appendMessage('user', msg);
            userInput.value = '';
            
            const chunkText = rawTextInput.value.trim();
            await sendToApi(chunkText, msg);
        }

        function handleEnter(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendToApi(chunkText, message) {
            loadingIndicator.style.display = 'block';
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch('http://localhost:8002/api/v1/tutor/chat/raw', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: chunkText,
                        message: message,
                        history: chatHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`خطأ في السيرفر: ${response.status}`);
                }

                const data = await response.json();
                
                // Add to visible chat
                appendMessage('bot', data.reply);
                
                // Update internal history for context
                chatHistory.push({ role: 'user', content: message });
                chatHistory.push({ role: 'model', content: data.reply });

            } catch (err) {
                appendMessage('bot', `❌ عذراً، حدث خطأ: ${err.message}`);
                console.error(err);
            } finally {
                loadingIndicator.style.display = 'none';
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
